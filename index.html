<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>社不同好会 - スレ一覧</title>
  <style>
body {
  background-color: #ffffff;
  background-image:
    linear-gradient(#eee 1px, transparent 1px),
    linear-gradient(90deg, #eee 1px, transparent 1px);
  background-size: 20px 20px;
  font-family: "Zen Maru Gothic", sans-serif;
}

h1 {
      text-align: center;
      color: #000000;
      font-family: "Zen Maru Gothic", "Rounded Mplus 1c", sans-serif;
      font-size: 30px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

.thread-table {
  width: 300px;
  border-collapse: collapse;
  margin: 20px auto;  /* ← autoで左右中央寄せ */
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(4px);
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.thread-table td {
  border: 1px solid #ccc;
  padding: 0;
  font-size: 18px;
  text-align: center;   /* ← 追加！中央揃え */
  vertical-align: middle;  /* ← 上下中央揃え */
}

/* ← これが重要 */
.thread-table td a {
  display: block;/* ← 行全体をクリック可能に */
  width: 100%;
  height: 100%;
  padding: 12px; /* ゆったり余白 */
  box-sizing: border-box;
  text-decoration: none;
  color: #444;
  font-family: "Zen Maru Gothic", sans-serif;
}

.thread-table tr:hover {
  background: #ffe5f1;  /* ホバー時にピンクっぽい */
}

.thread-table th {
  background: #f8f5ff;
  font-weight: 700;
}

.icon-cell {
  width: 48px;
  text-align: center;
}

.topic-icon {
  font-size: 24px;
}

/* 必要ならカテゴリごとに色を変えてもいい */
.topic-icon.anime { color: #ff6fa8; }
.topic-icon.game  { color: #00a2ff; }
.topic-icon.food  { color: #ffb347; }
.topic-icon.daily  { color: #2c39ebb2; }
.topic-icon.topic  { color: #2bf746e0; }

  </style>
</head>
<body>
  <h1>社不同好会 - スレ一覧</h1>

 <table class="thread-table">
  <<tr>
    <th>カテゴリ</th>
    <th>スレッド</th>
  </tr>
  <tr>
    <td class="icon-cell"><span class="topic-icon anime">🎬</span></td>
    <td><a href="アニメ.html">アニメ雑談</a></td>
  </tr>
  <tr>
    <td class="icon-cell"><span class="topic-icon game">🎮</span></td>
    <td><a href="ゲーム.html">ゲーム雑談</a></td>
  </tr>
  <tr>
    <td class="icon-cell"><span class="topic-icon food">🍳</span></td>
    <td><a href="料理.html">料理・ごはん</a></td>
  </tr>
  <tr>
    <td class="icon-cell"><span class="topic-icon daily">📖</span></td>
    <td><a href="./daily.html">日記</a></td>
  </tr>
  <tr>
    <td class="icon-cell"><span class="topic-icon topic">💬</span></td>
    <td><a href="./freeboard.html">新しい話題</a></td>
  </tr>
</table>
</body>
</html>
