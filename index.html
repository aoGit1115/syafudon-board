.thread-table {

.thread-table td {
  border: 1px solid #ccc;
  padding: 0;

/* ← これが重要 */
.thread-table td a {
  display: block;/* ← 行全体をクリック可能に */

  height: 100%;
  padding: 12px; /* ゆったり余白 */
  box-sizing: border-box;
  text-decoration: none;
  color: #444;
  font-family: "Zen Maru Gothic", sans-serif;
}

.thread-table tr:hover {
